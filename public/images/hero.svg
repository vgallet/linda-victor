<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Motif floral">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fbf7f1" />
      <stop offset="55%" stop-color="#f3ebe1" />
      <stop offset="100%" stop-color="#e6d8c8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <g id="branch">
      <path d="M0 0 C 40 -30 90 -45 150 -50" fill="none" stroke="#7d8c72" stroke-width="2.5" stroke-linecap="round" />
      <ellipse cx="30" cy="-26" rx="20" ry="9" fill="#7d8c72" opacity="0.55" transform="rotate(-28 30 -26)" />
      <ellipse cx="62" cy="-40" rx="22" ry="10" fill="#5b6a52" opacity="0.45" transform="rotate(-20 62 -40)" />
      <ellipse cx="100" cy="-50" rx="19" ry="9" fill="#7d8c72" opacity="0.5" transform="rotate(-12 100 -50)" />
      <ellipse cx="40" cy="-8" rx="18" ry="8" fill="#5b6a52" opacity="0.35" transform="rotate(18 40 -8)" />
      <ellipse cx="78" cy="-18" rx="20" ry="9" fill="#7d8c72" opacity="0.4" transform="rotate(12 78 -18)" />
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)" />
  <rect width="1600" height="1000" fill="url(#glow)" />

  <circle cx="800" cy="360" r="300" fill="none" stroke="#b4914f" stroke-width="1" opacity="0.35" />
  <circle cx="800" cy="360" r="345" fill="none" stroke="#b4914f" stroke-width="0.6" opacity="0.2" />

  <use href="#branch" transform="translate(120 880) scale(1.4)" />
  <use href="#branch" transform="translate(180 960) scale(1.1) rotate(-8)" />
  <use href="#branch" transform="translate(1480 900) scale(-1.4 1.4)" />
  <use href="#branch" transform="translate(1420 970) scale(-1.05 1.05)" />
  <use href="#branch" transform="translate(60 220) scale(0.9) rotate(24)" />
  <use href="#branch" transform="translate(1540 180) scale(-0.9 0.9) rotate(-24)" />

  <g opacity="0.5" fill="#d8b3a4">
    <circle cx="300" cy="150" r="6" />
    <circle cx="1320" cy="260" r="8" />
    <circle cx="1180" cy="120" r="5" />
    <circle cx="430" cy="720" r="7" />
    <circle cx="1120" cy="780" r="6" />
  </g>
</svg>
